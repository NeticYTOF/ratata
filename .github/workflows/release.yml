name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/ratata.exe" -DestinationPath "ratata-${{ matrix.target }}.zip"
      - name: Package (Linux)
        if: matrix.archive == 'tar.gz'
        run: tar -czf ratata-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release ratata
      - name: Upload artifact
        uses: softprops/action-gh-release@v2
        with:
          files: ratata-${{ matrix.target }}.${{ matrix.archive }}
